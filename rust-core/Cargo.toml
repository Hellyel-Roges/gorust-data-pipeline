[package]
name = "rust-core"
version.workspace = true
edition.workspace = true

[dependencies]
hex = "0.4"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
regex = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }